  <script>
(function () {
  function safePlay(video) {
    video.muted = true;
    video.playsInline = true;
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    var promise = video.play();
    if (promise && typeof promise.catch === 'function') {
      promise.catch(function () {});
    }
  }

  function loadVideo(video) {
    if (video.dataset.loaded === 'true') return;
    video.querySelectorAll('source[data-src]').forEach(function (source) {
      source.src = source.getAttribute('data-src');
    });
    video.dataset.loaded = 'true';
    video.load();
  }

  function activateVideo(video) {
    loadVideo(video);
    if (video.readyState >= 2) {
      safePlay(video);
    } else {
      video.addEventListener('canplay', function () { safePlay(video); }, { once: true });
      video.addEventListener('loadedmetadata', function () { safePlay(video); }, { once: true });
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    var videos = Array.prototype.slice.call(document.querySelectorAll('.ak-video'));
    if (!videos.length) return;

    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          var video = entry.target;
          if (entry.isIntersecting) {
            activateVideo(video);
          } else if (video.dataset.loaded === 'true') {
            video.pause();
          }
        });
      }, { rootMargin: '1600px 0px', threshold: 0.01 });

      videos.forEach(function (video) { observer.observe(video); });
    } else {
      videos.forEach(activateVideo);
    }
  });
})();
  </script>
