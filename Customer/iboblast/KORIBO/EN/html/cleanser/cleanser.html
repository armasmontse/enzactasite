<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="format-detection" content="telephone=no" />
  <title>alfa K:Lumen Magnet Charcoal Cleanser Detail Page</title>
  <style>
    :root {
      --content-width: 860px;
      --page-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", Arial, sans-serif;
    }
    body {
      overflow-x: hidden;
    }
    .detail-page {
      width: min(100%, var(--content-width));
      margin: 0 auto;
      padding: 0;
      background: #fff;
      line-height: 0;
    }
    .asset {
      display: block;
      margin: 0;
      padding: 0;
      line-height: 0;
      font-size: 0;
    }
    .asset img,
    .asset video {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      vertical-align: top;
      image-rendering: auto;
      -ms-interpolation-mode: bicubic;
      backface-visibility: hidden;
      transform: translateZ(0);
    }
    .asset video {
      background: #fff;
      object-fit: contain;
      outline: none;
    }
    @media (min-width: 861px) {
      .detail-page { width: var(--content-width); }
    }
  </style>
</head>
<body>
  <main class="detail-page" aria-label="Magnet Charcoal Cleanser detail page">
    <section class="asset" data-order="1" data-file="1(48).jpg">
      <img src="img/1.jpg" alt="1(48).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="2" data-file="2(14).mp4">
      <video src="img/2.mp4" autoplay muted loop playsinline preload="auto" controlslist="nodownload" aria-label="2(14).mp4"></video>
    </section>
    <section class="asset" data-order="3" data-file="3(21).gif">
      <img src="img/3.gif" alt="3(21).gif" decoding="async" />
    </section>
    <section class="asset" data-order="4" data-file="4(20).gif">
      <img src="img/4.gif" alt="4(20).gif" decoding="async" />
    </section>
    <section class="asset" data-order="5" data-file="5(23).jpg">
      <img src="img/5.jpg" alt="5(23).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="6" data-file="6(2).mp4">
      <video src="img/6.mp4" autoplay muted loop playsinline preload="auto" controlslist="nodownload" aria-label="6(2).mp4"></video>
    </section>
    <section class="asset" data-order="7" data-file="7(17).jpg">
      <img src="img/7.jpg" alt="7(17).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="8" data-file="8(2).mp4">
      <video src="img/8.mp4" autoplay muted loop playsinline preload="auto" controlslist="nodownload" aria-label="8(2).mp4"></video>
    </section>
    <section class="asset" data-order="9" data-file="9(12).jpg">
      <img src="img/9.jpg" alt="9(12).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="10" data-file="10(19).jpg">
      <img src="img/10.jpg" alt="10(19).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="11" data-file="11(21).jpg">
      <img src="img/11.jpg" alt="11(21).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="12" data-file="12(24).jpg">
      <img src="img/12.jpg" alt="12(24).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="13" data-file="13(26).jpg">
      <img src="img/13.jpg" alt="13(26).jpg" decoding="async" />
    </section>
    <section class="asset" data-order="14" data-file="14(16).jpg">
      <img src="img/14.jpg" alt="14(16).jpg" width="963" height="2048" decoding="async" />
    </section>
  </main>
  <script>
    // Keep MP4 sections playing smoothly on mobile/desktop browsers.
    document.querySelectorAll('video').forEach(function(video) {
      video.muted = true;
      video.playsInline = true;
      var playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(function() {
          video.controls = true;
        });
      }
    });
  </script>
</body>
</html>
