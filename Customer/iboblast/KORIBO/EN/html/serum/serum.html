<!doctype html>
<html lang="ko">
<head>

<meta name="viewport" content="width=860, initial-scale=1.0">
<title>Rice Ecto Repair Serum Detail Page</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
  }
  body {
    min-width: 860px;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  .detail-wrap {
    width: 860px;
    margin: 0 auto;
    padding: 0;
    background: #ffffff;
    line-height: 0;
    font-size: 0;
  }
  .media-block {
    display: block;
    width: 860px;
    margin: 0;
    padding: 0;
    line-height: 0;
    font-size: 0;
    overflow: hidden;
    background: #ffffff;
  }
  .media {
    display: block;
    width: 860px;
    max-width: none;
    height: auto;
    margin: 0;
    padding: 0;
    border: 0;
    vertical-align: top;
  }
  video.media {
    object-fit: contain;
    background: #ffffff;
  }
</style>
</head>
<body>
<main class="detail-wrap" aria-label="Rice Ecto Repair Serum detail page">

<script>
  // 안정적인 자동 재생: 브라우저 정책상 자동 재생이 막힐 경우 사용자가 클릭하면 재생됩니다.
  document.querySelectorAll('video').forEach(function(video) {
    video.muted = true;
    video.loop = true;
    video.playsInline = true;
    var tryPlay = function() { video.play().catch(function() {}); };
    video.addEventListener('loadeddata', tryPlay, { once: true });
    document.addEventListener('click', tryPlay, { once: true });
  });
</script>
